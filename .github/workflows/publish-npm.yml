name: Publish to npm

# Publishes the logos to npm as `brands-logo`, which also serves them from
# jsDelivr and unpkg (cdn.jsdelivr.net/npm/brands-logo@<version>/logos/...).
#
# Two ways to release:
#   1. Actions tab → "Publish to npm" → Run workflow, pick patch/minor/major.
#      The workflow bumps package.json, commits, tags vX.Y.Z and publishes.
#   2. Bump package.json yourself and push a matching tag (git tag v1.2.3).
#
# Auth: npm trusted publishing (OIDC). No token is stored in the repo; npm
# trusts this workflow file because it is registered on npmjs.com under
# brands-logo → Settings → Trusted publishers (GitHub Actions,
# rakibulism/brands-logo, workflow publish-npm.yml). Releases publish straight
# away with provenance, with no staged 2FA approval. Needs npm 11.5.1+.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Bump version, commit and tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release v%s"
          git push --follow-tags

      - name: Check tag matches package.json (tag pushes)
        if: github.event_name == 'push'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"
            exit 1
          fi

      - name: Smoke-test the entry points
        run: |
          node -e "const b=require('./npm/index.cjs'); if(!b.logos.length||!b.url('github')) process.exit(1); console.log(b.count,'logos')"
          node --input-type=module -e "import {logos,url} from './npm/index.js'; if(!logos.length) process.exit(1); console.log(url('github'))"

      - name: Use an npm with trusted publishing support
        run: npm install -g npm@latest && npm --version

      - name: Publish
        run: npm publish --access public
